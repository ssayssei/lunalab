<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달빛 타로 · 달빛 연구소</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0b1e; --bg2:#1b1433; --gold:#e3c27a; --gold2:#b8954a; --ink:#efe8ff; --dim:#a99cc9;
  --card-w:64px; --card-h:104px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Noto Serif KR",serif;color:var(--ink);
  background:radial-gradient(ellipse at 50% -10%,#3a2a6b 0%,var(--bg2) 35%,var(--bg) 75%);
  background-attachment:fixed; overflow-x:hidden;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:18px}
h1{font-family:"Cinzel",serif;letter-spacing:.18em;color:var(--gold);margin:0;font-size:clamp(26px,5vw,40px);text-shadow:0 0 18px rgba(227,194,122,.35)}
.sub{color:var(--dim);margin-top:6px;font-size:14px}
.panel{background:rgba(255,255,255,.04);border:1px solid rgba(227,194,122,.22);border-radius:16px;padding:20px;backdrop-filter:blur(4px)}
.step-title{font-size:15px;color:var(--gold);margin:0 0 10px;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid rgba(227,194,122,.35);background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;transition:.2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1230;border-color:transparent;font-weight:700}
input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(227,194,122,.3);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:15px;margin-bottom:18px}
input[type=text]::placeholder{color:#7d7099}
.btn{display:inline-block;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:16px;padding:13px 28px;border-radius:12px;color:#1a1230;background:linear-gradient(135deg,#f3dc9f,var(--gold2));box-shadow:0 6px 20px rgba(227,194,122,.25);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(227,194,122,.35)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2);box-shadow:none}
.center{text-align:center}
.hidden{display:none!important}
.msg{text-align:center;color:var(--dim);margin:14px 0;min-height:22px}
.msg b{color:var(--gold)}

/* card back */
.cback{
  width:100%;height:100%;border-radius:8px;
  background:
    radial-gradient(circle at 50% 50%,transparent 26%,rgba(227,194,122,.0) 27%),
    repeating-linear-gradient(45deg,rgba(227,194,122,.12) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(-45deg,rgba(227,194,122,.12) 0 2px,transparent 2px 9px),
    linear-gradient(160deg,#3b2470,#1d1240);
  border:2px solid var(--gold2);
  box-shadow:inset 0 0 0 3px #1d1240, inset 0 0 0 4px rgba(227,194,122,.5);
  display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:20px;
}
/* deck */
#deckArea{display:flex;flex-wrap:wrap;justify-content:center;padding:10px 10px 10px 24px;min-height:140px}
.dcard{width:var(--card-w);height:var(--card-h);margin:6px 0 6px -36px;cursor:pointer;transition:transform .25s, opacity .3s, margin .3s;position:relative}
.dcard:hover{transform:translateY(-14px) rotate(-2deg);z-index:5}
.dcard.picked{opacity:0;pointer-events:none;transform:translateY(-40px) scale(.8)}
.shuffling .dcard{animation:shuf .5s ease-in-out infinite alternate}
@keyframes shuf{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(var(--sx)) translateY(var(--sy)) rotate(var(--sr))}}

/* spread */
#spread{display:flex;justify-content:center;gap:clamp(10px,3vw,30px);flex-wrap:wrap;margin:10px 0 6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.slot-label{font-size:13px;color:var(--gold);letter-spacing:.1em}
.flip{width:150px;height:246px;perspective:1000px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.open .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
.face.back .cback{border-radius:12px;font-size:34px}
.face.front{transform:rotateY(180deg)}
.front-card{
  width:100%;height:100%;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:linear-gradient(170deg,#fbf3dc,#ead9ad);color:#2a1d4a;border:2px solid var(--gold2);
  box-shadow:inset 0 0 0 4px #fbf3dc, inset 0 0 0 5px var(--gold2), 0 10px 30px rgba(0,0,0,.45);
  transition:transform .6s;
}
.front-card.rev{transform:rotate(180deg)}
.fnum{font-family:"Cinzel",serif;font-size:15px;font-weight:700;letter-spacing:.1em}
.fsym{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;
  background:radial-gradient(circle,#fff8e4 0%,#f1dfae 60%,#d9bf7f 100%);border:1px solid var(--gold2);color:#4a2f86}
.fname{text-align:center}
.fname .en{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.08em;color:#6b5a8f}
.fname .ko{font-weight:700;font-size:16px}
.slot-tag{font-size:12px;color:var(--dim);min-height:16px}
.flip.waiting{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(227,194,122,0))}50%{filter:drop-shadow(0 0 14px rgba(227,194,122,.55))}}

/* reading */
#reading{margin-top:22px}
.rcard{border-left:3px solid var(--gold);padding:14px 16px;margin-bottom:14px;background:rgba(0,0,0,.18);border-radius:0 12px 12px 0;animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rcard h3{margin:0 0 6px;font-size:17px;color:var(--gold)}
.rcard h3 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.kw span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(227,194,122,.13);color:#f1dca8}
.rcard p{margin:6px 0;line-height:1.75;font-size:15px}
.summary{border:1px solid var(--gold2);border-radius:14px;padding:18px;background:linear-gradient(160deg,rgba(227,194,122,.10),rgba(255,255,255,.02));animation:fade .8s ease}
.summary h3{margin:0 0 8px;color:var(--gold);font-family:"Cinzel","Noto Serif KR",serif;letter-spacing:.06em}
.summary p{line-height:1.8;margin:6px 0}
.lucky{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.lucky div{flex:1;min-width:120px;text-align:center;padding:10px;border-radius:10px;background:rgba(0,0,0,.22);font-size:13px;color:var(--dim)}
.lucky b{display:block;color:var(--gold);font-size:17px;margin-top:3px}
.q-echo{text-align:center;color:#d8cdf5;font-style:italic;margin:4px 0 10px}
.home{position:absolute;top:14px;left:16px;color:var(--dim);text-decoration:none;font-size:13px;border:1px solid rgba(227,194,122,.25);padding:6px 12px;border-radius:999px;transition:.2s;z-index:2}
.home:hover{color:var(--gold);border-color:var(--gold)}
.foot{text-align:center;color:#6f6390;font-size:12px;margin-top:30px}
@media (max-width:560px){
  .flip{width:104px;height:170px}
  .fsym{width:62px;height:62px;font-size:34px}
  .fname .ko{font-size:13px}.fname .en{font-size:9px}.fnum{font-size:12px}
  :root{--card-w:48px;--card-h:80px}
  .dcard{margin-left:-30px}
}
.fsym.c{background:radial-gradient(circle,#f3f8ff 0%,#cfe0f7 60%,#9fbde6 100%);color:#24467d}
.fsym.s{background:radial-gradient(circle,#fafafa 0%,#dfe2ea 60%,#b4bac8 100%);color:#3b4152}
.fsym.w{background:radial-gradient(circle,#fff4ea 0%,#f6d2b4 60%,#e59f6c 100%);color:#7a3410}
.fsym.p{background:radial-gradient(circle,#f3fbef 0%,#d3ecc7 60%,#9ccc8a 100%);color:#2d5a20}
.fsym.minor{font-size:46px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;font-weight:700}
.badge.major{background:linear-gradient(135deg,#f3dc9f,var(--gold2));color:#1a1230}
.badge.minor{background:rgba(255,255,255,.1);color:var(--dim)}
.ai{margin-top:18px;border:1px solid rgba(167,139,250,.45);border-radius:14px;padding:18px;background:linear-gradient(160deg,rgba(124,92,214,.16),rgba(255,255,255,.02));animation:fade .8s ease}
.ai h3{margin:0 0 6px;color:#d6c6ff}
.ai .hint{color:var(--dim);font-size:13px;margin:0 0 12px}
.ai-out p{line-height:1.85;margin:8px 0;font-size:15px}
.ai-out b{color:var(--gold)}
.ai-out .you{color:#cbbcf2;font-size:14px;border-left:2px solid #8b6fe0;padding-left:10px;margin:16px 0 6px}
.ai-row{display:flex;gap:8px;margin-top:12px}
.ai-row input{margin:0;flex:1}
.ai-row .btn{padding:10px 18px;font-size:14px;white-space:nowrap}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ai-err{color:#f3a3a3;font-size:14px}
.ai-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.ai-links a{color:#d6c6ff;border:1px solid rgba(167,139,250,.5);padding:9px 16px;border-radius:10px;text-decoration:none;font-size:14px}
.ai-links a:hover{background:rgba(167,139,250,.15)}
.pv{margin-top:14px;color:var(--dim);font-size:13px}
.pv summary{cursor:pointer}
.pv pre{white-space:pre-wrap;background:rgba(0,0,0,.25);padding:12px;border-radius:10px;color:#d8cdf5;font-family:inherit;font-size:13px;line-height:1.6;user-select:all}
.pat{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(227,194,122,.3)}
.pat-h{color:var(--gold);font-weight:700;font-size:14px;margin-bottom:2px}
#pdfRoot .pat{border-top:1px dashed #d9bf7f}
#pdfRoot .pat-h{color:#8a6420}
/* PDF export layout (offscreen) */
#pdfRoot{position:fixed;left:-10000px;top:0;width:720px;background:#fbf6ea;color:#2a1d4a;font-family:"Noto Serif KR",serif}
#pdfRoot .pblock{padding:6px 4px;background:#fbf6ea}
#pdfRoot .phead{text-align:center;padding-bottom:10px;border-bottom:1px solid #d9bf7f}
#pdfRoot .ph-title{font-family:"Cinzel",serif;font-size:30px;letter-spacing:.18em;color:#8a6420;font-weight:700}
#pdfRoot .ph-meta{color:#6b5a8f;font-size:14px;margin-top:6px}
#pdfRoot .ph-q{font-style:italic;font-size:17px;margin-top:10px;color:#3a2a6b}
#pdfRoot .pcards{display:flex;justify-content:center;gap:28px;padding:10px 0}
#pdfRoot .pc{display:flex;flex-direction:column;align-items:center;gap:6px}
#pdfRoot .pc-label{color:#8a6420;font-size:13px;letter-spacing:.1em;font-weight:700}
#pdfRoot .pc-card{width:140px;height:230px}
#pdfRoot .pc-tag{font-size:12px;color:#6b5a8f}
#pdfRoot .rcard{background:#fff8e6;border-left:3px solid #c9a24f;border-radius:0 10px 10px 0;padding:12px 16px;animation:none}
#pdfRoot .rcard h3{color:#5b3fa0;font-size:17px;margin:0 0 6px}
#pdfRoot .rcard h3 small{color:#7d6e99}
#pdfRoot .rcard p{color:#2a1d4a;line-height:1.75;font-size:15px;margin:6px 0}
#pdfRoot .rcard p[style]{color:#6b5a8f!important}
#pdfRoot .kw span{background:#f1e3bf;color:#5a4410}
#pdfRoot .badge.minor{background:#ece4f7;color:#5b3fa0}
#pdfRoot .summary{border:1px solid #c9a24f;border-radius:12px;padding:16px;background:#fff8e6;animation:none}
#pdfRoot .summary h3{color:#8a6420}
#pdfRoot .summary p{color:#2a1d4a}
#pdfRoot .summary b{color:#8a6420}
#pdfRoot .lucky div{background:#f3e8cc;color:#6b5a8f}
#pdfRoot .lucky b{color:#8a6420}
#pdfRoot .ai-h{color:#5b3fa0;margin:8px 0 0;font-size:18px}
#pdfRoot .ai-p p{line-height:1.85;margin:0;font-size:15px;color:#2a1d4a}
#pdfRoot .ai-p p b{color:#8a6420}
#pdfRoot .ai-p .you{color:#5b3fa0;border-left:2px solid #8b6fe0;padding-left:10px;margin:8px 0 0;font-size:14px}
#pdfRoot .pfoot{text-align:center;color:#a99a7a;font-size:12px;padding-top:12px}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <a class="home" href="./">← 달빛 연구소</a>
  <header style="padding-top:30px">
    <h1>✦ LUNA TAROT ✦</h1>
    <div class="sub">마음속 질문을 떠올리고, 끌리는 카드를 골라 보세요</div>
  </header>

  <!-- STEP 1 -->
  <section id="s1" class="panel">
    <p class="step-title">① 무엇이 궁금한가요?</p>
    <div class="chips" id="topicChips">
      <button class="chip on" data-v="g">🔮 종합운</button>
      <button class="chip" data-v="l">💗 연애·관계</button>
      <button class="chip" data-v="w">💼 일·커리어</button>
      <button class="chip" data-v="m">💰 금전</button>
    </div>
    <p class="step-title">② 몇 장을 뽑을까요?</p>
    <div class="chips" id="spreadChips">
      <button class="chip" data-v="1">오늘의 한 장</button>
      <button class="chip on" data-v="3">과거 · 현재 · 미래 (3장)</button>
      <button class="chip" data-v="3b">상황 · 장애물 · 조언 (3장)</button>
    </div>
    <p class="step-title">③ 질문 (선택)</p>
    <input type="text" id="question" maxlength="80" placeholder="예) 이직을 하면 잘 풀릴까?">
    <div class="center"><button class="btn" id="startBtn">카드 섞기 ✦</button></div>
  </section>

  <!-- STEP 2 -->
  <section id="s2" class="hidden">
    <div class="q-echo" id="qEcho"></div>
    <div class="msg" id="pickMsg"></div>
    <div id="deckArea"></div>
    <div id="spread"></div>
    <div class="msg" id="flipMsg"></div>
    <div class="center" style="margin-top:6px">
      <button class="btn ghost hidden" id="flipAllBtn">모두 뒤집기</button>
    </div>
    <div id="reading"></div>
    <div class="center" style="margin-top:20px">
      <button class="btn ghost hidden" id="pdfBtn" style="margin-right:8px">📄 PDF로 저장</button>
      <button class="btn hidden" id="againBtn">다시 보기 ↺</button>
      <div class="msg" id="pdfMsg"></div>
    </div>
  </section>

  <div class="foot">78장 풀 덱 (메이저 22 · 마이너 56) · 정방향/역방향 · 카드 조합 · 흐름 읽기 · PDF 저장 · 재미로 보는 타로예요</div>
</div>

 {n:0,en:"The Fool",ko:"바보",s:"✦",k:["새 출발","자유","모험"],kr:["무모함","준비 부족","망설임"],
  g:"아무것도 정해지지 않은 백지 같은 상태예요. 두려움보다 호기심을 따라가면 뜻밖의 길이 열립니다.",

 {n:1,en:"The Magician",ko:"마법사",s:"∞",k:["실행력","재능","시작"],kr:["잔꾀","재능 낭비","불안정"],

 {n:2,en:"The High Priestess",ko:"여사제",s:"☾",k:["직관","비밀","내면"],kr:["혼란","숨겨진 정보","무시한 직감"],

  g:"씨앗이 열매를 맺는 풍요의 시기예요. 나 자신과 주변을 넉넉히 돌봐 주세요.",

  l:"따뜻하고 안정적인 사랑, 관계가 무르익는 흐름이에요.",lr:"지나친 집착이나 한쪽만 주는 관계를 돌아보세요.",

  "3b":{n:3,pos:["상황","장애물","조언"],lead:["지금 상황은","당신을 가로막는 것은","카드가 건네는 조언은"]}
};
const TOPIC_NAME={g:"종합운",l:"연애·관계",w:"일·커리어",m:"금전"};
const COLORS=["골드","보라","하늘색","에메랄드","코랄","실버","크림색","네이비"];

/* ---------- 상태 ---------- */
let topic="g", spreadKey="3", picks=[], opened=0, deckOrder=[];
const $=id=>document.getElementById(id);

function chipGroup(id,cb){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    [...$(id).children].forEach(c=>c.classList.remove("on"));
    b.classList.add("on"); cb(b.dataset.v);
  });
}
chipGroup("topicChips",v=>topic=v);
chipGroup("spreadChips",v=>spreadKey=v);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

$("startBtn").onclick=()=>{
  picks=[];opened=0;
  deckOrder=shuffle(CARDS.map(c=>({c,rev:Math.random()<0.3})));
  $("s1").classList.add("hidden");$("s2").classList.remove("hidden");
  const q=$("question").value.trim();
  $("qEcho").textContent=q?`“${q}”`:`— ${TOPIC_NAME[topic]} —`;
  $("reading").innerHTML="";$("spread").innerHTML="";$("flipMsg").textContent="";
  $("againBtn").classList.add("hidden");$("flipAllBtn").classList.add("hidden");
  $("pdfBtn").classList.add("hidden");$("pdfMsg").textContent="";
  buildDeck();
  buildSlots();
  const deck=$("deckArea");
  deck.classList.add("shuffling");
  $("pickMsg").innerHTML="카드를 섞는 중… 마음속으로 질문을 떠올려 보세요";
  setTimeout(()=>{deck.classList.remove("shuffling");updatePickMsg();},1600);
  window.scrollTo({top:0,behavior:"smooth"});
};

function buildDeck(){
  const deck=$("deckArea");deck.innerHTML="";deck.classList.remove("hidden");
  deckOrder.forEach((d,i)=>{
    const el=document.createElement("div");
    el.className="dcard";
    el.style.setProperty("--sx",(Math.random()*40-20)+"px");
    el.style.setProperty("--sy",(Math.random()*20-10)+"px");
    el.style.setProperty("--sr",(Math.random()*16-8)+"deg");
    el.style.animationDelay=(Math.random()*.4)+"s";
    el.innerHTML='<div class="cback">✧</div>';
    el.onclick=()=>pick(i,el);
    deck.appendChild(el);
  });
}
function buildSlots(){
  const sp=SPREADS[spreadKey],box=$("spread");
  for(let i=0;i<sp.n;i++){
    const s=document.createElement("div");s.className="slot";
    s.innerHTML=`<div class="slot-label">${sp.pos[i]}</div>
      <div class="flip" id="f${i}" style="visibility:hidden"><div class="flip-inner">
        <div class="face back"><div class="cback">☾</div></div>
        <div class="face front"></div></div></div>
      <div class="slot-tag" id="t${i}"></div>`;
    box.appendChild(s);
  }
}
function updatePickMsg(){
  const need=SPREADS[spreadKey].n-picks.length;
  $("pickMsg").innerHTML= need>0?`끌리는 카드를 <b>${need}장</b> 더 골라 주세요`:"";
}
function pick(i,el){
  if($("deckArea").classList.contains("shuffling")) return;
  const sp=SPREADS[spreadKey]; if(picks.length>=sp.n) return;
  el.classList.add("picked");
  const idx=picks.length; picks.push(deckOrder[i]);
  const f=$("f"+idx); f.style.visibility="visible"; f.animate([{opacity:0,transform:"translateY(-30px)"},{opacity:1,transform:"none"}],{duration:450,easing:"ease-out"});
  f.querySelector(".front").innerHTML=frontHTML(deckOrder[i]);
  updatePickMsg();
  if(picks.length===sp.n){
    setTimeout(()=>{
      $("deckArea").classList.add("hidden");
      $("flipMsg").innerHTML="카드를 눌러 한 장씩 뒤집어 보세요";
      if(sp.n>1) $("flipAllBtn").classList.remove("hidden");
      for(let k=0;k<sp.n;k++){const ff=$("f"+k);ff.classList.add("waiting");ff.onclick=()=>openCard(k);}
    },500);
  }
}
function frontHTML(d){
  const c=d.c;
  return `<div class="front-card ${d.rev?"rev":""}">
    <div class="fnum">${c.major?ROMAN[c.n]:c.face}</div>
    <div class="fsym ${c.major?"":"minor "+c.suit}">${c.s}</div>
    <div class="fname"><div class="en">${d.c.en.toUpperCase()}</div><div class="ko">${d.c.ko}</div></div></div>`;
}
function openCard(k){
  const f=$("f"+k); if(f.classList.contains("open")) return;
  f.classList.add("open");f.classList.remove("waiting");
  const d=picks[k];
  $("t"+k).textContent=`${d.c.ko} · ${d.rev?"역방향":"정방향"}`;
  setTimeout(()=>addReading(k),650);
  opened++;
  if(opened===picks.length){
    $("flipAllBtn").classList.add("hidden");$("flipMsg").textContent="";
    setTimeout(addSummary,1100);
  }
}
$("flipAllBtn").onclick=()=>{picks.forEach((_,k)=>setTimeout(()=>openCard(k),k*350));};

function topicText(c,rev){
  if(!c.major) return rev?c.gr:c.g;
  const key=topic==="g"?"g":topic;
  return rev?c[key+"r"]:c[key];
}
function extraText(c,rev){
  if(c.major) return topic==="g"?"":(rev?c.gr:c.g);
  const S=SUITS[c.suit];
  return topic==="g"?`${S.ko}는 ‘${S.theme}’을 다루는 문양이에요.`:S[topic];
}
function addReading(k){
  const sp=SPREADS[spreadKey],d=picks[k],c=d.c;
  const kws=(d.rev?c.kr:c.k).map(x=>`<span>#${x}</span>`).join("");
  const main=topicText(c,d.rev);
  const ex=extraText(c,d.rev);
  const extra= ex ? `<p style="color:var(--dim);font-size:14px">${ex}</p>` : "";
  const badge= c.major?'<span class="badge major">★ 메이저</span>':`<span class="badge minor">${SUITS[c.suit].s} 마이너</span>`;
  const el=document.createElement("div");el.className="rcard";
  el.innerHTML=`<h3>${sp.pos[k]} · ${c.ko}${badge}<small>${c.en} / ${d.rev?"역방향":"정방향"}</small></h3>
    <div class="kw">${kws}</div>
    <p>${sp.lead[k]} <b>‘${c.ko}’</b> 카드가 나왔어요. ${main}</p>${extra}`;
  // keep order
  const box=$("reading");
  el.dataset.k=k;
  const after=[...box.querySelectorAll(".rcard")].find(x=>+x.dataset.k>k);
  after?box.insertBefore(el,after):box.appendChild(el);
}
function addSummary(){
  const sp=SPREADS[spreadKey];
  const revCount=picks.filter(p=>p.rev).length;
  const ids=picks.map(p=>p.c.id);
  const nums=picks.map(p=>CARDS.indexOf(p.c));
  const bright=["M17","M19","M21","M3","M10","M1","c8","c9","w5","p9","p0"].filter(n=>ids.includes(n)).length;
  const heavy=["M13","M15","M16","M18","s2","s8","s9","p4"].filter(n=>ids.includes(n)).length;
  const majors=picks.filter(p=>p.c.major).length;
  const suitCount={};picks.forEach(p=>{if(!p.c.major)suitCount[p.c.suit]=(suitCount[p.c.suit]||0)+1;});
  let deckNote="";
  if(sp.n>1){
    if(majors>=2) deckNote=`메이저 아르카나가 ${majors}장이나 나왔어요. 이 질문은 일상의 작은 일이 아니라 <b>인생의 큰 흐름</b>과 맞닿아 있어요.`;
    else if(majors===0) deckNote="모두 마이너 아르카나예요. 운명보다는 <b>일상의 구체적인 상황</b>에 관한 이야기라, 내 선택과 행동으로 충분히 바꿀 수 있어요.";
    const dom=Object.entries(suitCount).find(([,v])=>v>=2);
    if(dom){const S=SUITS[dom[0]];deckNote+=(deckNote?" ":"")+`${S.s} ${S.ko}가 ${dom[1]}장 — 지금은 <b>${S.theme}</b>의 영역이 핵심이에요.`;}
  } else if(majors===1) deckNote="메이저 아르카나가 나왔어요. 오늘은 평소보다 의미 있는 하루가 될 수 있어요.";
  let tone;
  if(sp.n===1){
    tone = picks[0].rev ? "오늘은 속도를 조금 늦추고 주변을 살피는 게 좋은 날이에요."
                        : "오늘은 카드의 기운을 믿고 가볍게 한 걸음 내디뎌 보세요.";
  } else if(revCount===0) tone="세 장 모두 정방향이에요. 흐름이 순조롭고, 에너지가 막힘없이 흐르고 있어요.";
  else if(revCount===sp.n) tone="모두 역방향이 나왔어요. 지금은 밖으로 밀어붙이기보다 안을 점검하고 정리할 때라는 신호예요.";
  else if(revCount>=2) tone="역방향이 많은 편이에요. 막힌 부분을 먼저 풀어야 흐름이 살아나요.";
  else tone="대체로 좋은 흐름 속에 한 가지 걸림돌이 있어요. 그 부분만 조심하면 충분히 풀려요.";
  let mood="";
  if(bright>=2) mood=" 밝은 카드가 여럿 보여 전반적인 기운이 긍정적이에요.";
  else if(heavy>=2) mood=" 변화와 정리를 뜻하는 카드가 겹쳤어요. 무언가를 끝내야 새로운 것이 들어올 자리가 생겨요.";

  const last=picks[picks.length-1];
  let key;
  if(spreadKey==="3") key=`앞으로의 키워드는 <b>#${(last.rev?last.c.kr:last.c.k)[0]}</b>. 과거의 ‘${picks[0].c.ko}’에서 출발해 ‘${last.c.ko}’로 향하는 여정이에요.`;
  else if(spreadKey==="3b") key=`‘${picks[1].c.ko}’가 보여주는 장애물을 인정하고, ‘${last.c.ko}’의 조언처럼 <b>#${(last.rev?last.c.kr:last.c.k)[0]}</b>에 집중해 보세요.`;
  else key=`오늘의 키워드는 <b>#${(last.rev?last.c.kr:last.c.k)[0]}</b>.`;

  const luckyNum=(nums.reduce((a,b)=>a+b,0)%9)+1;
  const color=COLORS[nums.reduce((a,b)=>a*3+b,7)%COLORS.length];
  const pat=patternNotes();
  let patHTML="";
  if(pat.combo.length) patHTML+=`<div class="pat"><div class="pat-h">🃏 카드 조합</div>${pat.combo.map(x=>`<p>${x}</p>`).join("")}</div>`;
  if(pat.flow.length) patHTML+=`<div class="pat"><div class="pat-h">🌊 흐름 읽기</div>${pat.flow.map(x=>`<p>${x}</p>`).join("")}</div>`;
  const el=document.createElement("div");el.className="summary";
  el.innerHTML=`<h3>✦ 종합 해석 · ${TOPIC_NAME[topic]}</h3>
    <p>${tone}${mood}</p>${deckNote?`<p>${deckNote}</p>`:""}<p>${key}</p>${patHTML}
    <div class="lucky"><div>행운의 숫자<b>${luckyNum}</b></div><div>행운의 색<b>${color}</b></div><div>역방향<b>${revCount} / ${sp.n}</b></div></div>`;
  $("reading").appendChild(el);
  $("againBtn").classList.remove("hidden");
  el.scrollIntoView({behavior:"smooth",block:"center"});
  addAIBox();
  $("pdfBtn").classList.remove("hidden");
}

/* ---------- PDF 저장 ---------- */
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)) return res();
    const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));
    document.head.appendChild(s);
  });
}
const PDF_BG="#fbf6ea";
function pdfBlock(html,cls){
  const d=document.createElement("div");d.className="pblock "+(cls||"");d.innerHTML=html;return d;
}
$("pdfBtn").onclick=async()=>{
  const btn=$("pdfBtn"),msg=$("pdfMsg");
  btn.disabled=true;btn.textContent="PDF 만드는 중…";msg.textContent="";
  let root;
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    try{await document.fonts.ready;}catch(e){}
    const sp=SPREADS[spreadKey],q=$("question").value.trim();
    const now=new Date(), dateStr=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")}`;
    root=document.createElement("div");root.id="pdfRoot";document.body.appendChild(root);
    const blocks=[];
    blocks.push(pdfBlock(`<div class="ph-title">✦ LUNA TAROT ✦</div>
      <div class="ph-meta">${dateStr} · ${TOPIC_NAME[topic]} · ${sp.pos.join(" · ")}</div>
      ${q?`<div class="ph-q">“${esc(q)}”</div>`:""}`,"phead"));
    blocks.push(pdfBlock(`<div class="pcards">${picks.map((p,i)=>`
      <div class="pc"><div class="pc-label">${sp.pos[i]}</div><div class="pc-card">${frontHTML(p)}</div>
      <div class="pc-tag">${p.c.ko} · ${p.rev?"역방향":"정방향"}</div></div>`).join("")}</div>`));
    document.querySelectorAll("#reading .rcard").forEach(r=>blocks.push(pdfBlock(r.innerHTML,"rcard")));
    const sum=document.querySelector("#reading .summary");
    if(sum) blocks.push(pdfBlock(sum.innerHTML,"summary"));
    blocks.push(pdfBlock(`재미로 보는 타로예요 · LUNA LAB 달빛 연구소`,"pfoot"));
    blocks.forEach(b=>root.appendChild(b));

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=14,CW=PW-M*2;
    const paint=()=>{pdf.setFillColor(251,246,234);pdf.rect(0,0,PW,PH,"F");};
    paint();let y=M;
    for(const b of blocks){
      const cv=await html2canvas(b,{scale:2,backgroundColor:PDF_BG,useCORS:true,logging:false});
      const h=cv.height*CW/cv.width;
      if(y+h>PH-M && y>M){pdf.addPage();paint();y=M;}
      pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",M,y,CW,h);
      y+=h+(b.classList.contains("ai-p")?1.5:4);
    }
    pdf.save(`타로운세_${dateStr.replace(/\./g,"")}.pdf`);
    msg.textContent="PDF를 저장했어요 ✦";
  }catch(e){
    console.error(e);
    msg.textContent="PDF를 만들지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";
  }finally{
    if(root) root.remove();
    btn.disabled=false;btn.textContent="📄 PDF로 저장";
  }
};

/* ---------- AI에게 물어보기 (복사) ---------- */
function esc(s){return s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}
function readingContext(){
  const sp=SPREADS[spreadKey], q=$("question").value.trim();
  const lines=picks.map((p,i)=>{
    const c=p.c, kw=(p.rev?c.kr:c.k).join(", ");
    const kind=c.major?"메이저 아르카나":`마이너 아르카나 / ${SUITS[c.suit].ko}(${SUITS[c.suit].theme})`;
    return `${i+1}. [${sp.pos[i]}] ${c.ko} (${c.en}) — ${p.rev?"역방향":"정방향"} · ${kind} · 키워드: ${kw}`;
  }).join("\n");
  return `주제: ${TOPIC_NAME[topic]}\n질문: ${q||"(구체적인 질문 없음 — 주제 전반에 대한 흐름)"}\n스프레드: ${sp.pos.join(" / ")}\n뽑힌 카드:\n${lines}`;
}
function buildPrompt(){
  return `타로 카드를 뽑았어요. 따뜻하고 통찰력 있는 타로 리더처럼 해석해 주세요.

${readingContext()}

부탁:
- 제 질문과 상황에 맞춰 구체적으로 풀어 주세요.
- 각 카드의 자리 의미, 정/역방향, 메이저/마이너, 문양을 엮어서 하나의 이야기로 해석해 주세요.
- 카드끼리의 연결과 흐름도 짚어 주세요.
- 마지막에 실천할 수 있는 조언 1~2가지를 주세요.
- 미래를 단정하지 말고 흐름과 가능성으로 이야기해 주세요.`;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{
    const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok;
  }catch(e){return false;}
}
function addAIBox(){
  const box=document.createElement("div");box.className="ai";box.id="aiBox";
  box.innerHTML=`<h3>🔮 AI에게 더 깊이 물어보기</h3>
    <p class="hint">뽑은 카드와 질문을 정리한 문장을 복사해서, 무료 AI 채팅에 붙여 넣으면 내 상황에 맞춘 해석을 받을 수 있어요.</p>
    <div class="center"><button class="btn" id="copyPrompt">📋 질문 문장 복사하기</button></div>
    <div class="msg" id="copyMsg"></div>
    <div class="center ai-links hidden" id="aiLinks">
      <a href="https://claude.ai/new" target="_blank" rel="noopener">Claude 열기 ↗</a>
      <a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기 ↗</a>
    </div>
    <details class="pv"><summary>복사될 문장 미리 보기</summary><pre id="promptPreview"></pre></details>`;
  $("reading").appendChild(box);
  $("promptPreview").textContent=buildPrompt();
  $("copyPrompt").onclick=async()=>{
    const ok=await copyText(buildPrompt());
    $("copyMsg").innerHTML= ok?"<b>복사됐어요!</b> 아래 AI 채팅을 열고 붙여 넣기(Ctrl+V) 하세요.":"복사가 안 됐어요. 아래 미리 보기 문장을 직접 선택해서 복사해 주세요.";
    $("aiLinks").classList.remove("hidden");
    if(!ok) box.querySelector("details").open=true;
  };
}

/* ---------- 카드 조합 & 흐름 읽기 ---------- */
const COMBOS=[
 [["M16","M17"],"탑 + 별","무너진 자리에서 희망이 피어나는 조합이에요. 지금의 흔들림은 더 나은 회복을 위한 과정이에요."],
 [["M13","M19"],"죽음 + 태양","하나가 끝나고, 그 뒤에 아주 밝은 새 시작이 기다리고 있어요."],
 [["M6","M15"],"연인 + 악마","강한 끌림이 있지만 집착이나 유혹으로 번지지 않게 선을 지켜야 해요."],
 [["M0","M21"],"바보 + 세계","한 사이클이 완성되고 곧바로 새로운 여정이 시작되는 흐름이에요."],
 [["M1","M2"],"마법사 + 여사제","행동력과 직관이 함께 있어요. 감이 오는 대로 실행하면 잘 맞아떨어져요."],
 [["M3","M4"],"여황제 + 황제","따뜻함과 단단함이 만나 아주 안정적인 기반이 만들어져요."],
 [["M18","M2"],"달 + 여사제","직감은 강하지만 아직 드러나지 않은 게 많아요. 확인 전까지는 서두르지 마세요."],
 [["M18","M19"],"달 + 태양","불안과 오해가 걷히고 진실이 환하게 드러나는 흐름이에요."],
 [["M10","M20"],"운명의 수레바퀴 + 심판","운명적인 전환점이에요. 한 번 놓쳤던 기회가 다시 찾아올 수 있어요."],
 [["M9","M2"],"은둔자 + 여사제","답은 밖이 아니라 안에 있어요. 혼자만의 시간에서 해답을 찾게 돼요."],
 [["M7","M8"],"전차 + 힘","밀어붙이는 의지와 버티는 인내를 모두 갖췄어요. 목표 달성 가능성이 높아요."],
 [["M11","M20"],"정의 + 심판","그동안의 노력이 공정하게 평가받는 때예요. 뿌린 대로 거둬요."],
 [["M12","M13"],"매달린 사람 + 죽음","오래 멈춰 있던 상황이 마침내 끝나고 전환이 일어나요."],
 [["M15","M16"],"악마 + 탑","나를 묶고 있던 것이 한 번에 무너져요. 아프지만 결국 해방이에요."],
 [["M17","M19"],"별 + 태양","희망이 현실이 되는 최고의 조합 중 하나예요."],
 [["M5","M6"],"교황 + 연인","관계가 공식적인 약속으로 이어질 수 있는 조합이에요."],
 [["M14","s4"],"절제 + 소드 5","다툼 속에서 내가 중재자 역할을 하면 상황이 풀려요."],
 [["M6","c1"],"연인 + 컵 2","서로 마음이 통하는, 인연이라고 부를 만한 강한 신호예요."],

 [["s2","c5"],"소드 3 + 컵 6","과거의 상처와 추억이 함께 떠올라요. 이제는 정리하고 보내 줄 때예요."],

 [["p4","p5"],"펜타클 5 + 펜타클 6","어려운 시기지만 도움의 손길이 이어져요. 도움을 청해도 괜찮아요."],
 [["M4","s13"],"황제 + 소드 왕","원칙과 논리가 강하게 작용해요. 감정보다 기준을 세우는 게 먼저예요."]

const NUM_MEAN=["새로운 시작","선택과 균형","성장과 확장","안정과 정체","갈등과 변화","조화와 회복","시험과 도전","움직임과 속도","거의 다 온 완성 직전","완결과 마무리"];
function cardNum(c){ if(c.major) return c.n; return c.rank<=9 ? c.rank+1 : null; }
function patternNotes(){
  const sp=SPREADS[spreadKey], notes=[], ids=picks.map(p=>p.c.id);
  COMBOS.forEach(([pair,title,txt])=>{ if(pair.every(x=>ids.includes(x))) notes.push(`<b>✧ ${title}</b> — ${txt}`); });
  if(sp.n<2) return {combo:notes,flow:[]};
  const flow=[], minors=picks.filter(p=>!p.c.major);
  const rankCount={}; minors.forEach(p=>{ if(p.c.rank<=9) rankCount[p.c.rank]=(rankCount[p.c.rank]||0)+1; });
  Object.entries(rankCount).forEach(([r,v])=>{ if(v>=2) flow.push(`숫자 ${+r===0?"에이스(1)":+r+1}이(가) ${v}장 겹쳤어요. 숫자 ${+r+1}은 <b>${NUM_MEAN[r]}</b>을 뜻해서, 지금 그 기운이 특히 강해요.`); });
  const courts=minors.filter(p=>p.c.rank>=10).length;
  if(courts>=2) flow.push(`인물 카드가 ${courts}장 나왔어요. 이번 일은 <b>주변 사람들의 영향</b>이 커요. 누가 떠오르는지 생각해 보세요.`);
  const nums=picks.map(p=>cardNum(p.c));
  if(nums.every(n=>n!==null)){
    if(nums.every((n,i)=>i===0||n>nums[i-1])) flow.push(`카드 숫자가 ${nums.join(" → ")}로 점점 커져요. 일이 <b>앞으로 나아가며 성장하는 흐름</b>이에요.`);
    else if(nums.every((n,i)=>i===0||n<nums[i-1])) flow.push(`카드 숫자가 ${nums.join(" → ")}로 점점 작아져요. 무언가를 <b>정리하고 처음으로 돌아가는 흐름</b>이에요.`);
  }
  const f=picks[0].c,l=picks[picks.length-1].c;
  if(!f.major&&!l.major&&f.suit!==l.suit) flow.push(`처음엔 ${SUITS[f.suit].s} ‘${SUITS[f.suit].theme}’, 마지막엔 ${SUITS[l.suit].s} ‘${SUITS[l.suit].theme}’ — 관심의 무게가 옮겨 가고 있어요.`);
  const suits=new Set(minors.map(p=>p.c.suit));
  if(suits.has("w")&&suits.has("c")) flow.push("열정(완드)과 감정(컵)이 함께 나왔어요. 머리보다 마음이 앞서는 시기라, 중요한 결정은 하루 묵혀 보세요.");
  if(suits.has("s")&&suits.has("p")) flow.push("생각(소드)과 현실(펜타클)이 함께 나왔어요. 머릿속 계획을 현실의 행동으로 옮길 때예요.");
  if(suits.size===4) flow.push("네 문양이 모두 나왔어요. 감정·생각·열정·현실이 고르게 얽힌, 균형이 필요한 상황이에요.");
  const last=picks[picks.length-1];
  if(spreadKey==="3"&&last.rev) flow.push("미래 카드가 역방향이에요. 아직 정해진 게 아니라는 뜻이니, 지금 바꾸면 흐름도 바뀔 수 있어요.");
  if(spreadKey==="3b"&&!picks[1].rev&&picks[1].c.major) flow.push("장애물 자리에 메이저 카드가 정방향으로 나왔어요. 쉽게 치울 수 있는 벽은 아니니, 정면으로 마주하는 게 좋아요.");
  return {combo:notes,flow};
}

/* ---------- 별 배경 ---------- */
(function(){
  const cv=$("stars"),ctx=cv.getContext("2d");let st=[];
  function rs(){cv.width=innerWidth;cv.height=innerHeight;
    st=Array.from({length:Math.floor(innerWidth*innerHeight/6000)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.2,p:Math.random()*6.28}));}
  function draw(t){ctx.clearRect(0,0,cv.width,cv.height);
    for(const s of st){ctx.globalAlpha=.35+.45*Math.sin(t/900+s.p);ctx.fillStyle="#fff6dc";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();}
    requestAnimationFrame(draw);}
  addEventListener("resize",rs);rs();requestAnimationFrame(draw);
})();
</script>

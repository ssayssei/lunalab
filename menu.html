html,body{margin:0;min-height:100%}

.home:hover{color:var(--gold);border-color:var(--gold)}
.panel{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:12px}
.center{text-align:center}
.hidden{display:none!important}
.lab{font-family:"Cinzel",serif;letter-spacing:.25em;font-size:12px;color:var(--gold2)}
h1,h2,h3{font-family:"Jua",sans-serif;font-weight:400;margin:0}
h1{font-size:30px;color:var(--gold);margin-top:6px;text-shadow:0 0 16px rgba(227,194,122,.3)}
.lamp{display:flex;justify-content:center;gap:18px;font-size:22px;margin-bottom:6px}
.lamp span{display:inline-block;animation:sw 2.6s ease-in-out infinite}
.lamp span:nth-child(2){animation-delay:.4s}.lamp span:nth-child(3){animation-delay:.8s}
@keyframes sw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.q{font-family:"Jua";font-size:18px;color:var(--gold);margin:0 0 4px}
.qs{font-size:13px;color:var(--dim);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:"Jua";font-size:15px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(135deg,#f3dc9f,var(--gold2));color:#1a1230;border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg .chip{text-align:center;font-size:17px;padding:11px}
.btn{font-family:"Jua",sans-serif;font-size:18px;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;background:linear-gradient(135deg,#f3dc9f,var(--gold2));color:#1a1230;box-shadow:0 6px 20px rgba(227,194,122,.25);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2);box-shadow:none}
.btn.sm{font-size:15px;padding:10px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.ball{font-size:84px;line-height:1;margin:6px 0;filter:drop-shadow(0 0 22px rgba(227,194,122,.35))}
.ball.spin{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translateX(-3px) rotate(-4deg)}50%{transform:translateX(3px) rotate(4deg)}100%{transform:translateX(-3px) rotate(-4deg)}}
.ball.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.rname{font-family:"Jua";font-size:34px;color:var(--gold);margin:2px 0}
.rcat{font-size:13px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.tags span{font-size:13px;padding:4px 11px;border-radius:999px;background:rgba(227,194,122,.14);color:#f1dca8}
.say{line-height:1.8;font-size:15px;margin:12px 0 0;word-break:keep-all}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.alts button{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.alts button:hover{border-color:var(--gold)}
.alts b{display:block;font-size:26px;font-weight:400}
.ex{font-size:12px;color:var(--dim);margin-top:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#2a2050;border:1px solid var(--gold2);color:var(--ink);padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:10;pointer-events:none}

let st={meal:h<11?"L":h<15?"L":h<17?"S":"D",wx:null,mood:null,care:new Set(),cat:new Set(),ex:new Set(),recent:[],last:null};
function chips(box,list,multi,key){
  $(box).innerHTML=list.map(([v,l])=>`<button class="chip" data-v="${v}">${l}</button>`).join("");
  $(box).querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(multi){const set=st[key];set.has(v)?set.delete(v):set.add(v);b.classList.toggle("on");}
    else{st[key]=st[key]===v?null:v;$(box).querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.v===st[key]));}
  });
}
chips("wx",WX,false,"wx");chips("mood",MOOD,false,"mood");chips("care",CARE,true,"care");
chips("cat",CATS.map(c=>[c,c]),true,"cat");
function drawMeal(){$("meal").querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.v===st.meal));$("catPanel").classList.toggle("hidden",st.meal==="S");}
$("meal").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.meal=b.dataset.v;st.ex.clear();drawMeal();});
drawMeal();

function score(f){
  let s=1,why=[];
  if(st.wx&&f.tags.has(st.wx)){s+=2;why.push(st.wx);}
  if(st.mood&&f.tags.has(st.mood)){s+=2;why.push(st.mood);}
  st.care.forEach(c=>{if(f.tags.has(c)){s+=3;why.push(c);}else if(["spicy","light","soup","noodle","rice","meat","bread","sweet"].includes(c))s-=2;});
  return{f,s,why};
}
function basePool(){return FOOD.filter(f=>f.meal.includes(st.meal)&&(st.meal==="S"||!st.cat.size||st.cat.has(f.c)));}
function pick(){
  const pool=basePool().filter(f=>!st.ex.has(f.n)).map(score).sort((a,b)=>b.s-a.s);
  if(!pool.length)return null;
  const top=pool[0].s,cand=pool.filter(x=>x.s>=top-3);
  const w=c=>(c.s-(top-3)+1)*(st.recent.includes(c.f.n)?0.2:1)*(0.75+Math.random()*0.5);
  let tot=cand.reduce((a,c)=>a+(c._w=w(c)),0),r=Math.random()*tot,chosen=cand[0];
  for(const c of cand){r-=c._w;if(r<=0){chosen=c;break;}}
  st.recent=[chosen.f.n,...st.recent.filter(n=>n!==chosen.f.n)].slice(0,8);
  const rest=cand.filter(x=>x!==chosen).sort(()=>Math.random()-.5);
  const alts=[];
  for(const x of rest){if(alts.length<2&&x.f.c!==chosen.f.c&&!alts.some(a=>a.f.c===x.f.c))alts.push(x);}
  for(const x of rest.concat(pool)){if(alts.length<2&&x!==chosen&&!alts.includes(x))alts.push(x);}
  return{chosen,alts};
}
function show(res){
  const {chosen:c,alts}=res;st.last=c;
  $("rE").className="ball pop";$("rE").textContent=c.f.e;
  $("rTop").textContent=({L:"☀️ 오늘의 점심",D:"🌙 오늘의 저녁",S:"🍰 오늘의 간식"})[st.meal]+"은…";
  $("rN").textContent=c.f.n;$("rC").textContent=c.f.c;
  $("rT").innerHTML=(c.why.length?c.why:["오늘의 운명"]).map(w=>`<span>#${LABEL[w]||w}</span>`).join("");
  const lines=SAY[st.mood||"none"];$("rS").textContent=lines[Math.floor(Math.random()*lines.length)];
  $("rA").innerHTML=alts.map(a=>`<button data-n="${a.f.n}"><b>${a.f.e}</b>${a.f.n}</button>`).join("");
  $("rA").querySelectorAll("button").forEach(b=>b.onclick=()=>{const a=alts.find(x=>x.f.n===b.dataset.n);show({chosen:a,alts:alts.filter(x=>x!==a).concat([c])});});
  $("ex").textContent=st.ex.size?"제외한 메뉴: "+[...st.ex].join(", "):"마음에 드는 다른 후보를 누르면 그걸로 바꿀 수 있어요";
}
function roll(){
  const res=pick();
  $("res").classList.remove("hidden");
  if(!res){$("rE").className="ball";$("rE").textContent="🤔";$("rN").textContent="후보가 다 떨어졌어요";$("rC").textContent="";$("rT").innerHTML="";$("rS").textContent="제외한 메뉴를 초기화할게요. 다시 뽑아 주세요!";$("rA").innerHTML="";st.ex.clear();$("ex").textContent="";return;}
  $("res").scrollIntoView({behavior:"smooth",block:"start"});
  const el=$("rE"),nm=$("rN");el.className="ball spin";$("rT").innerHTML="";$("rS").textContent="";$("rA").innerHTML="";$("rC").textContent="";$("rTop").textContent="점괘를 읽는 중…";
  let i=0;const pool=basePool();
  const iv=setInterval(()=>{const f=pool[Math.floor(Math.random()*pool.length)];el.textContent=f.e;nm.textContent=f.n;if(++i>12){clearInterval(iv);show(res);}},85);
}
$("go").onclick=roll;$("again").onclick=roll;
$("nope").onclick=()=>{if(st.last)st.ex.add(st.last.f.n);roll();};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}
$("copy").onclick=async()=>{
  if(!st.last)return;
  const txt=`🔮 달빛 야시장 메뉴 점집\n${({L:"오늘의 점심",D:"오늘의 저녁",S:"오늘의 간식"})[st.meal]}은 ${st.last.f.e} ${st.last.f.n}!\n${st.last.why.map(w=>"#"+LABEL[w]).join(" ")}`;
  try{await navigator.clipboard.writeText(txt);toast("결과를 복사했어요! 🔗");}catch(e){toast("복사가 안 됐어요. 화면을 캡처해 주세요!");}
};
(function(){const cv=$("stars"),ctx=cv.getContext("2d");let s=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;s=Array.from({length:Math.floor(innerWidth*innerHeight/6000)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.2,p:Math.random()*6.28}));}
function draw(t){ctx.clearRect(0,0,cv.width,cv.height);for(const p of s){ctx.globalAlpha=.35+.45*Math.sin(t/900+p.p);ctx.fillStyle="#fff6dc";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();}requestAnimationFrame(draw);}
addEventListener("resize",rs);rs();requestAnimationFrame(draw);})();
</script>
<script>
/* ===== 달빛 야시장 · 미니모드 & 단속반 (파일 안에 내장) =====
   🪟 미니 / M 키: 작은 창을 따로 열어서 거기서 하기 (창 열기가 막히면 이 창을 작고 촘촘하게)
   🚨 단속반 / B 키: 엑셀 화면으로 휙 숨기기 (다시 누르거나 클릭하면 복귀) */
(function(){
  const KEY="luna_mini_mode";
  const FAKE="2026_11월_정산_최종_v3(수정).xlsx";
  const realTitle=document.title;
  const POP=new URLSearchParams(location.search).has("mini");
  let pref=false;try{pref=localStorage.getItem(KEY)==="1";}catch(e){}
  const st=document.createElement("style");
  st.textContent=`
  #lunaBar{position:fixed;right:12px;bottom:12px;z-index:9998;display:flex;gap:6px}
  #lunaBar button{border:1px solid rgba(227,194,122,.45);background:rgba(27,20,51,.9);color:#efe8ff;font:700 13px/1 "Noto Serif KR",serif;
    padding:9px 12px;border-radius:999px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  #lunaBar button:hover{border-color:#e3c27a;color:#fff}
  #lunaBar #lunaRaid{border-color:rgba(255,107,122,.7);background:rgba(40,14,30,.9);color:#ffd6dc}
  #lunaBar .siren{display:inline-block;animation:lunaSiren 1.4s infinite}
  @keyframes lunaSiren{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  body.luna-mini #lunaBar{right:6px;bottom:6px;gap:4px}
  body.luna-mini #lunaBar button{padding:6px 9px;font-size:12px}
  body.luna-mini{zoom:.72}
  body.luna-mini[data-mini-zoom="off"]{zoom:1}
  body.luna-mini .wrap{max-width:440px!important;padding-top:8px!important;padding-bottom:56px!important}
  body.luna-mini .foot,body.luna-mini .lamp,body.luna-mini .keys,body.luna-mini header .sub,body.luna-mini details{display:none!important}
  body.luna-mini .home{position:static!important;display:inline-block;margin-bottom:8px}
  body.luna-mini header{margin-bottom:12px!important}
  #lunaCover{position:fixed;inset:0;z-index:9999;background:#f3f3f3;color:#222;font:13px/1.4 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:auto;zoom:1}
  body.luna-mini #lunaCover{zoom:1.39}
  body.luna-mini[data-mini-zoom="off"] #lunaCover{zoom:1}
  #lunaCover .xb{background:#217346;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
  #lunaCover .xm{display:flex;gap:14px;padding:6px 14px;background:#fff;border-bottom:1px solid #ddd;color:#444;font-size:12px}
  #lunaCover .xf{padding:4px 14px;background:#fff;border-bottom:1px solid #ddd;color:#555;font-size:12px;font-family:Consolas,monospace}
  #lunaCover table{border-collapse:collapse;margin:10px;background:#fff;min-width:620px}
  #lunaCover td,#lunaCover th{border:1px solid #d4d4d4;padding:4px 10px;text-align:right;white-space:nowrap}
  #lunaCover th{background:#e9e9e9;font-weight:600;text-align:center}
  #lunaCover td:first-child{text-align:left}
  #lunaCover tr:last-child td{font-weight:700;background:#f7f7f7}
  #lunaToast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9997;background:#2a1030;border:1px solid #ff6b7a;color:#ffe;
    padding:9px 16px;border-radius:999px;font:700 13px "Noto Serif KR",serif;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  #lunaToast.show{opacity:1}`;
  document.head.appendChild(st);

  function coverHTML(){
    const rows=["본사 직영","가산점","구로점","신도림점","영등포점","광명점","부천점","안양점","시흥점","인천점","수원점","분당점","일산점"];
    let h=`<div class="xb"><span>📊 ${FAKE}</span><span>저장됨 ✓</span></div>
      <div class="xm"><span>파일</span><span>홈</span><span>삽입</span><span>페이지 레이아웃</span><span>수식</span><span>데이터</span><span>검토</span></div>
      <div class="xf">fx&nbsp;&nbsp;=SUM(C3:C15)-SUMIF(H3:H15,"보류",C3:C15)</div><table>
      <tr><th>매장</th><th>청구액</th><th>수금액</th><th>미수금</th><th>수수료(3.3%)</th><th>정산액</th><th>비고</th></tr>`;
    const T=[0,0,0,0,0];
    rows.forEach((r,i)=>{const a=1200000+((i*7919)%900)*1000,b=a-((i*311)%5)*100000,f=Math.round(a*.033);
      T[0]+=a;T[1]+=b;T[2]+=a-b;T[3]+=f;T[4]+=b-f;
      h+=`<tr><td>${r}</td><td>${a.toLocaleString()}</td><td>${b.toLocaleString()}</td><td>${(a-b).toLocaleString()}</td><td>${f.toLocaleString()}</td><td>${(b-f).toLocaleString()}</td><td>${i%4?"":"확인 필요"}</td></tr>`;});
    return h+`<tr><td>합계</td>${T.map(v=>`<td>${v.toLocaleString()}</td>`).join("")}<td></td></tr></table>`;
  }
  function toast(m){let t=document.getElementById("lunaToast");if(!t){t=document.createElement("div");t.id="lunaToast";document.body.appendChild(t);}
    t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}
  const covered=()=>!!document.getElementById("lunaCover");
  function cover(){
    if(covered())return;
    const d=document.createElement("div");d.id="lunaCover";d.innerHTML=coverHTML();d.addEventListener("click",uncover);document.body.appendChild(d);
    document.title=FAKE;window.dispatchEvent(new Event("luna:cover"));
  }
  function uncover(){
    const d=document.getElementById("lunaCover");if(!d)return;
    d.remove();document.title=realTitle;window.dispatchEvent(new Event("luna:uncover"));toast("휴… 단속반 갔다~ 😮‍💨");
  }
  /* 🪟 미니: 먼저 작은 창을 따로 열어 보고, 막히면 이 창을 미니 모드로 */
  function openPopup(){
    const u=new URL(location.href);["r","a","vs"].forEach(k=>{if(k!=="vs")u.searchParams.delete(k);});u.searchParams.set("mini","1");
    const w=400,h=720,L=Math.max(0,(screen.availWidth||1200)-w-24),T=Math.max(0,(screen.availHeight||800)-h-50);
    let win=null;try{win=window.open(u.toString(),"luna_mini",`popup=yes,width=${w},height=${h},left=${L},top=${T},resizable=yes,scrollbars=yes`);}catch(e){}
    if(!win)return false;
    try{win.focus();}catch(e){}
    window.dispatchEvent(new Event("luna:cover"));
    let id=setTimeout(()=>{},0);while(id>0){clearTimeout(id);clearInterval(id);id--;}
    document.body.innerHTML="";document.body.className="";
    document.body.style.cssText="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0b1e;color:#efe8ff;font-family:'Gowun Dodum',sans-serif;text-align:center";
    const d=document.createElement("div");
    d.innerHTML='<div style="font-size:46px">🪟</div><div style="font-family:Jua,sans-serif;font-size:22px;color:#f6c98a;margin:8px 0">작은 창에서 하는 중이에요</div><div style="font-size:14px;color:#a99cc9;line-height:1.8">이 창은 닫아도 돼요 👋<br>작은 창이 안 보이면 작업 표시줄을 확인해 주세요</div><button id="lunaBack" style="margin-top:16px;font:inherit;font-size:14px;color:#f6c98a;background:transparent;border:1px solid rgba(246,201,138,.5);border-radius:10px;padding:8px 14px;cursor:pointer">↩ 이 창에서 계속하기</button>';
    document.body.appendChild(d);document.title="🪟 작은 창에서 하는 중";
    document.getElementById("lunaBack").onclick=()=>location.reload();
    return true;
  }
  function miniClick(){
    if(POP){setMini(!document.body.classList.contains("luna-mini"),false);return;}
    if(document.body.classList.contains("luna-mini")){setMini(false,true);return;}
    if(!openPopup())setMini(true,true);
  }
  function setMini(on,say){
    document.body.classList.toggle("luna-mini",on);
    if(!POP){try{localStorage.setItem(KEY,on?"1":"0");}catch(e){}}
    const m=document.getElementById("lunaMini");if(m)m.textContent=on?"🔍 크게":"🪟 미니";
    window.dispatchEvent(new Event("resize"));
    if(say)toast(on?"작은 창이 막혀서 이 창을 미니 모드로 바꿨어요 · 창을 작게 줄여서 써요 🤫":"원래 크기로 돌아왔어요");
  }
  function init(){
    const bar=document.createElement("div");bar.id="lunaBar";
    bar.innerHTML='<button type="button" id="lunaMini" title="이 창을 작고 촘촘하게 보기 (M)">🪟 미니</button><button type="button" id="lunaRaid" title="엑셀 화면으로 숨기 (B)"><span class="siren">🚨</span> 단속반</button>';
    document.body.appendChild(bar);
    document.getElementById("lunaMini").addEventListener("click",e=>{e.stopPropagation();miniClick();});
    document.getElementById("lunaRaid").addEventListener("click",e=>{e.stopPropagation();cover();});
    setMini(POP||pref,false);
    if(POP){document.title="🏮";document.querySelectorAll("a[href]").forEach(a=>{const h=a.getAttribute("href");if(!h||/^(https?:|mailto:|#|javascript:)/i.test(h))return;if(h==="./"||/index\.html/.test(h)){a.setAttribute("href","market.html?mini=1");return;}a.setAttribute("href",h+(h.includes("?")?"&":"?")+"mini=1");});}
    document.addEventListener("keydown",e=>{
      const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;
      if(e.key==="b"||e.key==="B"){e.preventDefault();e.stopImmediatePropagation();covered()?uncover():cover();}
      else if((e.key==="m"||e.key==="M")&&!covered()){e.preventDefault();e.stopImmediatePropagation();miniClick();}
      else if(e.key==="Escape"&&covered())uncover();
    },true);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
